name: Lumora Assets Fork Credential Boundary
on:
  push:
    branches: ['security/dosec16-360-oidc-fork-boundary-20261115']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-cloud-credential:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert inherited publishing path is inactive on fork
        run: node --test tests/security/upload-s3-fork-boundary.test.mjs

# Historic Trust Wallet publisher retained as a readable retirement marker.
# This fork is NOT the canonical publishing owner. The previous workflow requested
# AWS OIDC before checking repository identity. No fork release may use that path.
name: Trust Wallet upstream S3 publisher — disabled on Lumora assets fork

on:
  workflow_dispatch:

# No cloud role, secret, OIDC, write token or third-party deploy action is used.
permissions:
  contents: read

jobs:
  publication-disabled-on-fork:
    if: github.repository == 'trustwallet/assets'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Upstream publication is not configured by this fork
        run: echo "No upstream AWS publication is permitted from this fork."
